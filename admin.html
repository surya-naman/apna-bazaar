<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Dashboard | Apna Bazaar</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="navbar"></div>

  <main class="container">
    <h1 class="page-title">Admin Dashboard</h1>
    <div id="admin-stats" class="stat-grid"></div>
    <h2 class="section-title">Recent Orders</h2>
    <div class="table-wrap" id="recent-orders"></div>
    <h2 class="section-title">Product Overview</h2>
    <div class="table-wrap" id="product-overview"></div>
    <h2 class="section-title">Vendor Overview</h2>
    <div class="table-wrap" id="vendor-overview"></div>
    <h2 class="section-title">Demo Data</h2>
    <p class="note">This clears all products, orders, reviews and the cart in this browser and restores the original sample data.</p>
    <button class="btn btn-danger" id="reset-button">Reset Demo Data</button>
  </main>
  <div id="footer"></div>
  <script src="js/main.js"></script>
  <script src="js/admin.js"></script>
</body>
</html>
