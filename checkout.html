<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Checkout | Apna Bazaar</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="navbar"></div>

  <main class="container">
    <h1 class="page-title">Checkout</h1>
    <div id="checkout-empty" class="empty-box" style="display:none"></div>
    <div id="confirmation" class="confirm-box" style="display:none"></div>
    <div id="checkout-layout" class="two-column">
      <form id="checkout-form" class="card" novalidate>
        <h2>Delivery Details</h2>
        <div id="form-errors" class="error-box" style="display:none"></div>
        <label for="c-name">Full Name</label>
        <input type="text" id="c-name" placeholder="e.g. Rohan Verma">
        <label for="c-mobile">Mobile Number</label>
        <input type="text" id="c-mobile" maxlength="10" placeholder="10 digit number">
        <label for="c-email">Email Address</label>
        <input type="email" id="c-email" placeholder="you@example.com">
        <label for="c-address">Delivery Address</label>
        <textarea id="c-address" rows="3" placeholder="House no, street, area"></textarea>
        <div class="form-row">
          <div><label for="c-city">City</label><input type="text" id="c-city" value="Ludhiana"></div>
          <div><label for="c-pincode">Pincode</label><input type="text" id="c-pincode" maxlength="6" placeholder="6 digits"></div>
        </div>
        <label>Payment Method</label>
        <div class="radio-row"><label><input type="radio" name="payment" value="Cash on Delivery" checked> Cash on Delivery</label></div>
        <div class="radio-row"><label><input type="radio" name="payment" value="Demo Online Payment"> Demo Online Payment (simulated)</label></div>
        <p class="note">Demo Online Payment is only a simulation. No real money is charged and no card details are asked.</p>
        <button type="submit" class="btn btn-block">Place Order</button>
      </form>
      <div class="card" id="checkout-summary"></div>
    </div>
  </main>
  <div id="footer"></div>
  <script src="js/main.js"></script>
  <script src="js/checkout.js"></script>
</body>
</html>
